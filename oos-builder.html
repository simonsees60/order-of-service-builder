<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Order of Service Builder</title>

<!-- Home screen / standalone app support (iOS + Android) -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OoS Builder">
<meta name="theme-color" content="#8A4E62">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">

<link href="fonts.css" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E9;
    --ink:#2B2926;
    --ink-soft:#635E57;
    --rose:#A9647A;
    --rose-deep:#8A4E62;
    --sage:#6E7A6B;
    --line:#DAD3C6;
    --card:#FCFAF6;
    --done:#6E7A6B;
    --todo:#B85C4A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .shell{display:flex;flex-direction:column;min-height:100vh;}
  header{
    padding:20px 24px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:12px 20px;
  }
  header h1{font-size:22px;color:var(--rose-deep);}
  header .sub{color:var(--ink-soft);font-size:13px;flex:1;}
  header input#deceasedName{
    font-family:'Fraunces',serif;
    font-size:16px;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:4px 2px;
    min-width:220px;
    color:var(--ink);
  }
  header input#deceasedName:focus{outline:none;border-bottom-color:var(--rose);}
  .layout{
    display:flex;
    flex:1;
    min-height:0;
  }
  @media (max-width: 880px){
    .layout{flex-direction:column;}
  }
  .form-col{
    flex:1.3;
    padding:20px 24px 80px;
    overflow-y:auto;
  }
  .preview-col{
    flex:1;
    border-left:1px solid var(--line);
    background:var(--card);
    padding:20px 24px;
    overflow-y:auto;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
  }
  @media (max-width: 880px){
    .preview-col{border-left:none;border-top:1px solid var(--line);position:static;height:auto;}
  }
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{
    font-family:'Work Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab.active{background:var(--rose);color:#fff;border-color:var(--rose);}
  .panel{display:none;}
  .panel.active{display:block;}

  .section{
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    background:var(--card);
    overflow:hidden;
  }
  .section-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .section-num{
    font-family:'Fraunces',serif;
    font-size:13px;
    color:var(--ink-soft);
    width:20px;
  }
  .section-head h2{font-size:15px;flex:1;}
  .section-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--line);
    flex-shrink:0;
  }
  .section-dot.done{background:var(--sage);}
  .chevron{color:var(--ink-soft);font-size:12px;transition:transform .15s;}
  .section.open .chevron{transform:rotate(90deg);}
  .section-body{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid var(--line);
  }
  .section.open .section-body{display:block;padding-top:14px;}

  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:12px 0 4px;
  }
  label:first-child{margin-top:0;}
  input[type=text], textarea, select{
    width:100%;
    font-family:'Work Sans',sans-serif;
    font-size:14.5px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:56px;}
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--rose);}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .photo-field{display:flex;gap:12px;align-items:flex-start;}
  .photo-preview{
    width:96px;height:96px;flex-shrink:0;
    border:1px dashed var(--line);border-radius:8px;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:11px;color:var(--ink-soft);
    overflow:hidden;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-btn-row{display:flex;flex-direction:column;gap:6px;}
  .photo-btn{
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    border-radius:6px;padding:7px 12px;font-size:12.5px;cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }
  .photo-remove{color:var(--todo);border-color:var(--todo);}
  .photo-status{font-size:11.5px;color:var(--todo);margin-top:4px;}
  .check-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .check-row input{width:16px;height:16px;}
  .check-row label{margin:0;font-size:13.5px;color:var(--ink);}
  .confirm-row{
    margin-top:16px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .confirm-row input{width:17px;height:17px;accent-color:var(--sage);}
  .confirm-row label{margin:0;font-size:13px;font-weight:500;color:var(--sage);}

  .order-list{list-style:none;margin:0;padding:0;counter-reset:step;}
  .order-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .order-item:last-child{border-bottom:none;}
  .order-item.dragging{opacity:.5;}
  .order-idx{
    font-family:'Fraunces',serif;
    color:var(--rose-deep);
    font-size:13px;
    width:18px;
    flex-shrink:0;
    align-self:flex-start;
    padding-top:1px;
  }
  .order-main{flex:1;min-width:0;}
  .order-main strong{display:block;font-size:14px;}
  .order-main span{font-size:12.5px;color:var(--ink-soft);}
  .placeholder-tag{color:var(--todo);font-style:italic;}
  .order-controls{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .order-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    padding:6px 5px;
    cursor:pointer;
    border-radius:5px;
  }
  .order-btn:hover{background:var(--paper);}
  .order-btn:disabled{opacity:.25;cursor:default;}
  .order-btn:disabled:hover{background:none;}
  .drag-handle{
    font-size:16px;
    color:var(--ink-soft);
    padding:6px 4px;
    cursor:grab;
    touch-action:none;
    user-select:none;
  }

  .progress-wrap{margin-bottom:14px;}
  .progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--sage);transition:width .2s;}
  .progress-text{font-size:12px;color:var(--ink-soft);margin-top:5px;}

  .checklist{list-style:none;margin:0;padding:0;}
  .checklist li{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .checklist li:last-child{border-bottom:none;}
  .ck-icon{width:16px;flex-shrink:0;font-size:13px;padding-top:1px;}
  .ck-icon.done{color:var(--sage);}
  .ck-icon.todo{color:var(--todo);}
  .ck-done-text{color:var(--ink-soft);text-decoration:line-through;}

  .copy-btn, .new-btn{
    width:100%;
    padding:11px;
    border-radius:7px;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:500;
    font-size:13.5px;
    cursor:pointer;
    margin-top:16px;
  }
  .copy-btn{background:var(--rose);color:#fff;}
  .copy-btn:active{background:var(--rose-deep);}
  .new-btn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);width:100%;margin-top:0;}
  .family-actions{display:flex;gap:8px;margin-top:8px;}
  .family-actions .new-btn{margin-top:0;}
  .saved-note{font-size:11px;color:var(--sage);margin-top:8px;text-align:center;height:14px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(43,41,38,.45);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal-backdrop[hidden]{display:none;}
  .family-panel{
    background:var(--card);border-radius:10px;padding:18px;
    max-width:420px;width:100%;max-height:80vh;overflow-y:auto;
  }
  .family-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .family-panel-head strong{font-family:'Fraunces',serif;font-size:16px;}
  .family-panel-close{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:0 4px;}
  .family-list{list-style:none;margin:0;padding:0;}
  .family-list li{display:flex;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .family-list li:last-child{border-bottom:none;}
  .family-row-main{flex:1;min-width:0;text-align:left;background:none;border:none;cursor:pointer;padding:4px 2px;font-family:inherit;}
  .family-row-main strong{display:block;font-size:14px;color:var(--ink);}
  .family-row-main span{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .family-row-main.current strong{color:var(--rose-deep);}
  .family-delete{background:none;border:none;color:var(--todo);font-size:12.5px;cursor:pointer;padding:6px;flex-shrink:0;}
  .family-empty{color:var(--ink-soft);font-size:13px;padding:10px 2px;}
  .family-panel-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .family-panel-actions .photo-btn{flex:1;}
  .family-import-status{font-size:12px;color:var(--sage);margin-top:8px;text-align:center;}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Order of Service Builder</h1>
    <input id="deceasedName" placeholder="Who is this service for?">
    <div class="sub">Fills in live as you talk with the family</div>
  </header>

  <div class="layout">
    <div class="form-col" id="formCol"></div>

    <div class="preview-col">
      <div class="tabs">
        <button class="tab active" data-panel="order">Order of Service</button>
        <button class="tab" data-panel="checklist">Still Needed</button>
      </div>

      <div class="panel active" id="panel-order">
        <ol class="order-list" id="orderList"></ol>
      </div>

      <div class="panel" id="panel-checklist">
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText"></div>
        </div>
        <ul class="checklist" id="checklistUl"></ul>
      </div>

      <button class="copy-btn" id="copyBtn">Copy for the full script</button>
      <div class="family-actions">
        <button class="new-btn" id="newBtn">Save & start next family</button>
        <button class="new-btn" id="openBtn">Open a family</button>
      </div>
      <div class="saved-note" id="savedNote"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="familyModal" hidden>
  <div class="family-panel">
    <div class="family-panel-head">
      <strong>Saved families</strong>
      <button type="button" class="family-panel-close" id="familyPanelClose" aria-label="Close">&times;</button>
    </div>
    <ul class="family-list" id="familyList"></ul>
    <div class="family-panel-actions">
      <button type="button" class="photo-btn" id="exportBtn">Export all families</button>
      <button type="button" class="photo-btn" id="importBtn">Import families</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="family-import-status" id="importStatus"></div>
  </div>
</div>

<script>
const SECTIONS = [
  { id:'basics', title:'Basics', confirmLabel:'Basic service details confirmed', fields:[
    {id:'photo', label:'Photo', type:'photo', hint:'Upload a file or take one with the camera.'},
    {id:'fullName', label:'Full name', type:'text'},
    {id:'preferredName', label:'Preferred name / what family calls them', type:'text'},
    {id:'birthDate', label:'Date of birth', type:'text'},
    {id:'deathDate', label:'Date of death', type:'text'},
    {id:'age', label:'Age', type:'text'},
    {id:'serviceDate', label:'Service date', type:'text'},
    {id:'serviceTime', label:'Service time', type:'text'},
    {id:'venue', label:'Venue / location', type:'text'},
  ]},
  { id:'people', title:'Family & key people', confirmLabel:'Family members confirmed', fields:[
    {id:'spouseName', label:'Spouse / partner', type:'text'},
    {id:'childrenNames', label:'Children (names, ages if relevant)', type:'textarea'},
    {id:'siblingsNames', label:'Siblings / other close family', type:'textarea'},
    {id:'excludeNames', label:'Anyone to leave out of the service entirely', type:'textarea', hint:'Write "None" if not applicable, so it\u2019s clear you asked.'},
    {id:'namingNotes', label:'Naming preferences', type:'textarea', hint:'e.g. "goes by Robert, never Bob"'},
  ]},
  { id:'faith', title:'Faith & tone', confirmLabel:'Faith & tone discussed', fields:[
    {id:'faithType', label:'Overall approach', type:'select', options:['','Religious','Secular','Mixed / some tension','Not yet sure']},
    {id:'tensionNotes', label:'Any differing views to navigate carefully', type:'textarea'},
  ]},
  { id:'speakers', title:'Speakers', confirmLabel:'Speaker list confirmed', fields:[
    {id:'speakers', label:'One per line: Name \u2013 Relationship \u2013 what they\u2019ll speak about', type:'textarea', hint:'e.g. Summer \u2013 spouse \u2013 eulogy'},
  ]},
  { id:'life', title:'Life & themes', confirmLabel:'Life story details gathered', fields:[
    {id:'occupation', label:'Occupation / career', type:'text'},
    {id:'hobbies', label:'Hobbies, passions, interests', type:'textarea'},
    {id:'personality', label:'Personality, how people describe them', type:'textarea'},
    {id:'stories', label:'Notable stories, nicknames, mottos', type:'textarea'},
  ]},
  { id:'music', title:'Music', confirmLabel:'Music choices confirmed', fields:[
    {id:'preludeSong', label:'Prelude', type:'text'},
    {id:'openingSong', label:'Opening song', type:'text'},
    {id:'interludeSong', label:'Musical interlude', type:'text'},
    {id:'closingSong', label:'Closing song', type:'text'},
    {id:'avoidSongs', label:'Anything to avoid', type:'text'},
  ]},
  { id:'reading', title:'Readings & poems', confirmLabel:'Reading / poem decided', fields:[
    {id:'readingChoice', label:'Selection', type:'select', options:['','When Great Trees Fall \u2013 Maya Angelou','Rumi \u2013 Goodbyes are only for those who love with their eyes','Scripture passage','Family will choose','Open to Simon\u2019s suggestion','Other']},
    {id:'readingOther', label:'If other, what', type:'text'},
  ]},
  { id:'rituals', title:'Rituals', confirmLabel:'Rituals discussed', fields:[
    {id:'candleLighting', label:'Candle lighting ceremony (your usual)', type:'checkbox'},
    {id:'candleWho', label:'Who lights it', type:'text'},
    {id:'wantsDifferentRitual', label:'Family wants something different instead of the candle ceremony', type:'checkbox'},
    {id:'otherRitual', label:'What they want instead', type:'text', hint:'Only relevant if the box above is ticked.'},
    {id:'roseCeremony', label:'Rose ceremony', type:'checkbox'},
    {id:'roseWho', label:'Who places roses', type:'text'},
    {id:'slideshow', label:'Photo slideshow', type:'checkbox'},
  ]},
  { id:'sensitive', title:'Sensitivities', confirmLabel:'Sensitive topics confirmed', fields:[
    {id:'avoidTopics', label:'Topics, facts, or names not to raise on stage', type:'textarea', hint:'Write "None" if not applicable.'},
  ]},
  { id:'logistics', title:'Logistics', confirmLabel:'Logistics confirmed', fields:[
    {id:'attendeeCount', label:'Expected attendees', type:'text'},
    {id:'printedProgram', label:'Printed program needed', type:'checkbox'},
    {id:'otherNotes', label:'Anything else', type:'textarea'},
  ]},
];

let state = {};
let openSection = 'basics';
let currentId = null;

const OLD_STORAGE_KEY = 'oos-builder-current';
const INDEX_KEY = 'oos-index';
const CURRENT_ID_KEY = 'oos-current-id';
const familyKey = (id) => 'oos-family:' + id;
const photoKey = (id) => 'oos-photo:' + id;

function newId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadIndex(){
  try { return JSON.parse(localStorage.getItem(INDEX_KEY)) || []; } catch(e){ return []; }
}

function saveIndex(idx){
  try { localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); } catch(e){}
}

function upsertIndexEntry(id, name){
  const idx = loadIndex();
  const entry = idx.find(f => f.id === id);
  const updatedAt = Date.now();
  if (entry){ entry.name = name || 'Unnamed service'; entry.updatedAt = updatedAt; }
  else idx.push({ id, name: name || 'Unnamed service', updatedAt });
  saveIndex(idx);
}

function removeIndexEntry(id){
  saveIndex(loadIndex().filter(f => f.id !== id));
}

function relativeTime(ts){
  if (!ts) return '';
  const mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.round(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          if (width > height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}

function renderPhotoField(){
  const wrap = document.createElement('div');
  wrap.className = 'photo-field';

  const preview = document.createElement('div');
  preview.className = 'photo-preview';
  if (state.photo){
    const img = document.createElement('img');
    img.src = state.photo;
    preview.appendChild(img);
  } else {
    preview.textContent = 'No photo yet';
  }
  wrap.appendChild(preview);

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.hidden = true;

  const status = document.createElement('div');
  status.className = 'photo-status';

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    resizeImage(file, 900, 0.82).then(dataUrl => {
      state.photo = dataUrl;
      save();
      renderForm();
    }).catch(() => {
      status.textContent = "Couldn't use that photo — try a different one.";
      setTimeout(() => status.textContent = '', 4000);
    });
  };

  const btnRow = document.createElement('div');
  btnRow.className = 'photo-btn-row';

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'photo-btn';
  addBtn.textContent = state.photo ? 'Replace photo' : 'Add photo';
  addBtn.onclick = () => fileInput.click();
  btnRow.appendChild(addBtn);

  if (state.photo){
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'photo-btn photo-remove';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => { delete state.photo; save(); renderForm(); };
    btnRow.appendChild(removeBtn);
  }

  const controls = document.createElement('div');
  controls.appendChild(fileInput);
  controls.appendChild(btnRow);
  controls.appendChild(status);
  wrap.appendChild(controls);
  return wrap;
}

function renderForm(){
  const col = document.getElementById('formCol');
  col.innerHTML = '';
  SECTIONS.forEach((sec, i) => {
    const wrap = document.createElement('div');
    wrap.id = 'section-' + sec.id;
    wrap.className = 'section' + (openSection === sec.id ? ' open' : '');
    const confirmed = !!state[sec.id + '_confirmed'];

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<span class="section-num">${i+1}</span>
      <h2>${sec.title}</h2>
      <span class="section-dot ${confirmed ? 'done' : ''}"></span>
      <span class="chevron">\u25B8</span>`;
    head.onclick = () => {
      const opening = openSection !== sec.id;
      openSection = opening ? sec.id : null;
      renderForm();
      if (opening){
        const target = document.getElementById('section-' + sec.id);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'section-body';

    sec.fields.forEach(f => {
      const lbl = document.createElement('label');
      lbl.textContent = f.label;

      if (f.type === 'checkbox'){
        const row = document.createElement('div');
        row.className = 'check-row';
        const inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = !!state[f.id];
        inp.id = 'f_' + f.id;
        inp.onchange = () => { state[f.id] = inp.checked; save(); renderOrder(); renderChecklist(); };
        const l2 = document.createElement('label');
        l2.setAttribute('for', 'f_' + f.id);
        l2.textContent = f.label;
        row.appendChild(inp); row.appendChild(l2);
        body.appendChild(row);
        return;
      }

      if (f.type === 'photo'){
        body.appendChild(lbl);
        body.appendChild(renderPhotoField());
        if (f.hint){
          const h = document.createElement('div');
          h.className = 'hint';
          h.textContent = f.hint;
          body.appendChild(h);
        }
        return;
      }

      body.appendChild(lbl);
      let inp;
      if (f.type === 'textarea'){
        inp = document.createElement('textarea');
      } else if (f.type === 'select'){
        inp = document.createElement('select');
        f.options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o; opt.textContent = o || 'Choose one\u2026';
          inp.appendChild(opt);
        });
      } else {
        inp = document.createElement('input');
        inp.type = 'text';
      }
      inp.value = state[f.id] || '';
      inp.oninput = () => { state[f.id] = inp.value; save(); renderOrder(); renderChecklist(); updateHeaderName(); };
      body.appendChild(inp);

      if (f.hint){
        const h = document.createElement('div');
        h.className = 'hint';
        h.textContent = f.hint;
        body.appendChild(h);
      }
    });

    const confirmRow = document.createElement('div');
    confirmRow.className = 'confirm-row';
    const cInp = document.createElement('input');
    cInp.type = 'checkbox';
    cInp.checked = confirmed;
    cInp.id = 'confirm_' + sec.id;
    cInp.onchange = () => { state[sec.id + '_confirmed'] = cInp.checked; save(); renderForm(); renderChecklist(); };
    const cLbl = document.createElement('label');
    cLbl.setAttribute('for', 'confirm_' + sec.id);
    cLbl.textContent = sec.confirmLabel;
    confirmRow.appendChild(cInp); confirmRow.appendChild(cLbl);
    body.appendChild(confirmRow);

    wrap.appendChild(body);
    col.appendChild(wrap);
  });
}

function parseSpeakers(){
  const raw = state.speakers || '';
  return raw.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split('\u2013').map(p => p.trim());
    return { name: parts[0] || line, relationship: parts[1] || '', topic: parts[2] || '' };
  });
}

function item(key, label, detail, placeholder){
  const hasDetail = detail && detail.trim();
  return { key, label, detail: hasDetail ? detail : (placeholder ? placeholder : ''), missing: !hasDetail };
}

function buildOrderRows(){
  const rows = [];

  rows.push(item('prelude', 'Prelude', state.preludeSong, '[Prelude song TBD]'));
  rows.push(item('openingSong', 'Opening song', state.openingSong, '[Opening song TBD]'));
  if (state.candleLighting && !state.wantsDifferentRitual){
    rows.push(item('candleLighting', 'Candle lighting', state.candleWho ? 'Lit by ' + state.candleWho : '', '[Who lights the candle?]'));
  }
  if (state.wantsDifferentRitual){
    rows.push(item('openingRitual', 'Opening ritual (in place of candle lighting)', state.otherRitual, '[What does the family want instead?]'));
  }
  rows.push(item('welcome', 'Welcome', 'Simon Ratcliffe'));

  const speakers = parseSpeakers();
  if (speakers.length){
    speakers.forEach((s, i) => {
      rows.push(item('eulogy:' + i, 'Eulogy / remarks', [s.name, s.relationship, s.topic].filter(Boolean).join(' \u2013 ')));
    });
  } else {
    rows.push(item('eulogy:default', 'Eulogy / remarks', '', '[Speakers not yet confirmed]'));
  }

  if (state.interludeSong){
    rows.push(item('interlude', 'Musical interlude', state.interludeSong));
  }

  let readingLabel = state.readingChoice === 'Other' ? state.readingOther : state.readingChoice;
  rows.push(item('reading', 'Reflection & reading', readingLabel, '[Reading not yet chosen]'));

  if (state.roseCeremony){
    rows.push(item('roseCeremony', 'Rose ceremony', state.roseWho ? 'Placed by ' + state.roseWho : '', '[Who places the roses?]'));
  }
  if (state.slideshow){
    rows.push(item('slideshow', 'Photo slideshow', ''));
  }

  rows.push(item('finalThoughts', 'Final thoughts & blessing', 'Simon Ratcliffe'));
  rows.push(item('closingSong', 'Closing song', state.closingSong, '[Closing song TBD]'));

  return rows;
}

// Keeps whatever custom order the celebrant has dragged items into, but slots
// any newly-appearing item (e.g. a ritual just ticked on) in next to its
// nearest already-placed neighbour from the default running order, rather
// than always dumping it at the end.
function reconcileOrder(rows){
  const activeKeys = rows.map(r => r.key);
  const byKey = {};
  rows.forEach(r => byKey[r.key] = r);

  let seq = Array.isArray(state.orderSequence) ? state.orderSequence.filter(k => activeKeys.includes(k)) : [];
  const missing = activeKeys.filter(k => !seq.includes(k));

  missing.forEach(key => {
    const baseIdx = activeKeys.indexOf(key);
    let insertAfter = -1;
    for (let i = baseIdx - 1; i >= 0; i--){
      const pos = seq.indexOf(activeKeys[i]);
      if (pos !== -1){ insertAfter = pos; break; }
    }
    seq.splice(insertAfter + 1, 0, key);
  });

  state.orderSequence = seq;
  return seq.map(k => byKey[k]);
}

function moveOrderItem(key, dir){
  const seq = state.orderSequence || [];
  const idx = seq.indexOf(key);
  const swapWith = dir === 'up' ? idx - 1 : idx + 1;
  if (idx === -1 || swapWith < 0 || swapWith >= seq.length) return;
  [seq[idx], seq[swapWith]] = [seq[swapWith], seq[idx]];
  save();
  renderOrder();
}

function renderOrder(){
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  const rows = reconcileOrder(buildOrderRows());

  rows.forEach((r, i) => {
    const li = document.createElement('li');
    li.className = 'order-item';
    li.dataset.key = r.key;
    li.innerHTML = `<span class="order-idx">${i+1}</span>
      <div class="order-main">
        <strong>${r.label}</strong>
        <span class="${r.missing ? 'placeholder-tag' : ''}">${r.detail || ''}</span>
      </div>
      <div class="order-controls">
        <button type="button" class="order-btn" data-dir="up" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>\u25b4</button>
        <button type="button" class="order-btn" data-dir="down" aria-label="Move down" ${i === rows.length - 1 ? 'disabled' : ''}>\u25be</button>
        <span class="drag-handle" aria-label="Drag to reorder">\u2630</span>
      </div>`;
    list.appendChild(li);
  });

  attachOrderInteractions(list);
}

function attachOrderInteractions(list){
  list.querySelectorAll('.order-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const li = btn.closest('.order-item');
      moveOrderItem(li.dataset.key, btn.dataset.dir);
    };
  });

  let dragEl = null;

  list.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('pointerdown', (e) => {
      dragEl = handle.closest('.order-item');
      dragEl.classList.add('dragging');
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
  });

  function onMove(e){
    if (!dragEl) return;
    const pointerY = e.clientY;
    const siblings = Array.from(list.querySelectorAll('.order-item')).filter(li => li !== dragEl);
    let placed = false;
    for (const sib of siblings){
      const rect = sib.getBoundingClientRect();
      if (pointerY < rect.top + rect.height / 2){
        list.insertBefore(dragEl, sib);
        placed = true;
        break;
      }
    }
    if (!placed) list.appendChild(dragEl);
  }

  function endDrag(){
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    state.orderSequence = Array.from(list.querySelectorAll('.order-item')).map(li => li.dataset.key);
    dragEl = null;
    save();
    renderOrder();
  }

  list.addEventListener('pointermove', onMove);
  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);
}

function renderChecklist(){
  const items = SECTIONS.map(s => ({
    label: s.confirmLabel,
    done: !!state[s.id + '_confirmed'],
  }));
  const doneCount = items.filter(i => i.done).length;
  document.getElementById('progressFill').style.width = (doneCount / items.length * 100) + '%';
  document.getElementById('progressText').textContent = `${doneCount} of ${items.length} topics covered`;

  const ul = document.getElementById('checklistUl');
  ul.innerHTML = '';
  items.forEach(i => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="ck-icon ${i.done ? 'done' : 'todo'}">${i.done ? '\u2713' : '\u25CB'}</span>
      <span class="${i.done ? 'ck-done-text' : ''}">${i.label}</span>`;
    ul.appendChild(li);
  });
}

function updateHeaderName(){
  const el = document.getElementById('deceasedName');
  if (document.activeElement !== el) el.value = state.fullName || '';
}

function compileText(){
  let out = `ORDER OF SERVICE INTAKE \u2014 ${state.fullName || 'Unnamed service'}\n\n`;
  SECTIONS.forEach(sec => {
    out += `${sec.title.toUpperCase()}\n`;
    sec.fields.forEach(f => {
      if (f.type === 'photo') return;
      let val = state[f.id];
      if (f.type === 'checkbox') val = val ? 'Yes' : 'No';
      out += `${f.label}: ${val || '(not provided)'}\n`;
    });
    out += '\n';
  });
  return out;
}

document.getElementById('copyBtn').onclick = () => {
  const text = compileText();
  navigator.clipboard.writeText(text).then(() => {
    const note = document.getElementById('savedNote');
    note.textContent = 'Copied \u2014 ready to turn into the full script.';
    setTimeout(() => note.textContent = '', 4000);
  });
};

document.getElementById('newBtn').onclick = () => {
  startNewFamily();
  const note = document.getElementById('savedNote');
  note.textContent = 'Saved. Ready for the next family.';
  setTimeout(() => note.textContent = '', 4000);
};

document.getElementById('openBtn').onclick = () => {
  flushSave();
  renderOpenList();
  document.getElementById('familyModal').hidden = false;
};

document.getElementById('familyPanelClose').onclick = () => {
  document.getElementById('familyModal').hidden = true;
};

document.getElementById('familyModal').onclick = (e) => {
  if (e.target.id === 'familyModal') document.getElementById('familyModal').hidden = true;
};

function showImportStatus(msg){
  const el = document.getElementById('importStatus');
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 6000);
}

function exportAllFamilies(){
  const idx = loadIndex();
  const families = idx.map(f => {
    let familyState = {};
    try { familyState = JSON.parse(localStorage.getItem(familyKey(f.id))) || {}; } catch(e){}
    const photo = localStorage.getItem(photoKey(f.id));
    return { id: f.id, state: familyState, photo: photo || null };
  });
  const payload = { app: 'oos-builder', version: 1, exportedAt: Date.now(), families };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'order-of-service-families-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importFamiliesFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try { payload = JSON.parse(reader.result); } catch(e){
      showImportStatus('That file could not be read.');
      return;
    }
    if (!payload || !Array.isArray(payload.families)){
      showImportStatus('That does not look like an export file from this app.');
      return;
    }
    let count = 0;
    payload.families.forEach(f => {
      if (!f || !f.id || !f.state) return;
      try {
        localStorage.setItem(familyKey(f.id), JSON.stringify(f.state));
        if (f.photo) localStorage.setItem(photoKey(f.id), f.photo);
        upsertIndexEntry(f.id, f.state.fullName);
        count++;
      } catch(e){}
    });
    showImportStatus(`Imported ${count} famil${count === 1 ? 'y' : 'ies'}.`);
    renderOpenList();
  };
  reader.onerror = () => showImportStatus('That file could not be read.');
  reader.readAsText(file);
}

document.getElementById('exportBtn').onclick = () => {
  flushSave();
  exportAllFamilies();
};

document.getElementById('importBtn').onclick = () => {
  document.getElementById('importFile').click();
};

document.getElementById('importFile').onchange = () => {
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files[0];
  fileInput.value = '';
  if (file) importFamiliesFromFile(file);
};

document.getElementById('deceasedName').oninput = (e) => {
  state.fullName = e.target.value;
  save(); renderOrder(); renderChecklist();
  const firstField = document.getElementById('f_fullName');
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  };
});

function persistCurrentFamily(){
  if (!currentId) return;
  // The photo is stored under its own key, separate from the text fields below.
  // That way, if a large photo ever pushes the device's storage quota over the
  // edge, the text autosave still succeeds instead of silently failing too.
  const { photo, ...rest } = state;
  try {
    localStorage.setItem(familyKey(currentId), JSON.stringify(rest));
    localStorage.setItem(CURRENT_ID_KEY, currentId);
  } catch(e){}
  if (photo){
    try { localStorage.setItem(photoKey(currentId), photo); }
    catch(e){ notePhotoSaveFailed(); }
  } else {
    try { localStorage.removeItem(photoKey(currentId)); } catch(e){}
  }
  upsertIndexEntry(currentId, rest.fullName);
}

function notePhotoSaveFailed(){
  const note = document.getElementById('savedNote');
  if (!note) return;
  note.textContent = "Couldn't save the photo — device storage may be full.";
  setTimeout(() => { if (note.textContent.startsWith("Couldn't save the photo")) note.textContent = ''; }, 5000);
}

function attachPhoto(id){
  try {
    const p = localStorage.getItem(photoKey(id));
    if (p) state.photo = p;
  } catch(e){}
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistCurrentFamily, 400);
}

function flushSave(){
  clearTimeout(saveTimer);
  persistCurrentFamily();
}

function startNewFamily(){
  flushSave();
  currentId = newId();
  state = {};
  openSection = 'basics';
  document.getElementById('deceasedName').value = '';
  renderForm(); renderOrder(); renderChecklist();
}

function openFamily(id){
  const raw = localStorage.getItem(familyKey(id));
  if (!raw) return;
  flushSave();
  try { state = JSON.parse(raw); } catch(e){ state = {}; }
  attachPhoto(id);
  currentId = id;
  try { localStorage.setItem(CURRENT_ID_KEY, currentId); } catch(e){}
  openSection = 'basics';
  document.getElementById('deceasedName').value = state.fullName || '';
  document.getElementById('familyModal').hidden = true;
  renderForm(); renderOrder(); renderChecklist();
}

function deleteFamily(id){
  try { localStorage.removeItem(familyKey(id)); } catch(e){}
  try { localStorage.removeItem(photoKey(id)); } catch(e){}
  removeIndexEntry(id);
  if (id === currentId){
    currentId = newId();
    state = {};
    openSection = 'basics';
    document.getElementById('deceasedName').value = '';
    renderForm(); renderOrder(); renderChecklist();
  }
  renderOpenList();
}

function renderOpenList(){
  const ul = document.getElementById('familyList');
  ul.innerHTML = '';
  const idx = loadIndex().sort((a, b) => b.updatedAt - a.updatedAt);

  if (!idx.length){
    ul.innerHTML = '<li class="family-empty">No saved families yet.</li>';
    return;
  }

  idx.forEach(f => {
    const isCurrent = f.id === currentId;
    const li = document.createElement('li');
    li.innerHTML = `<button type="button" class="family-row-main${isCurrent ? ' current' : ''}" data-id="${f.id}">
        <strong>${f.name || 'Unnamed service'}${isCurrent ? ' (current)' : ''}</strong>
        <span>Last edited ${relativeTime(f.updatedAt)}</span>
      </button>
      <button type="button" class="family-delete" data-id="${f.id}">Delete</button>`;
    ul.appendChild(li);
  });

  ul.querySelectorAll('.family-row-main').forEach(btn => {
    btn.onclick = () => openFamily(btn.dataset.id);
  });
  ul.querySelectorAll('.family-delete').forEach(btn => {
    btn.onclick = () => {
      if (confirm('Delete this saved family? This cannot be undone.')) deleteFamily(btn.dataset.id);
    };
  });
}

function load(){
  currentId = localStorage.getItem(CURRENT_ID_KEY);
  if (currentId && localStorage.getItem(familyKey(currentId))){
    try { state = JSON.parse(localStorage.getItem(familyKey(currentId))); } catch(e){ state = {}; }
    attachPhoto(currentId);
  } else {
    // No current family yet -- migrate an older single-draft save if one exists, so nothing is lost.
    let migrated = null;
    try {
      const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
      if (oldRaw) migrated = JSON.parse(oldRaw);
    } catch(e){}
    currentId = newId();
    state = migrated || {};
    if (migrated) persistCurrentFamily();
    else { try { localStorage.setItem(CURRENT_ID_KEY, currentId); } catch(e){} }
  }
  document.getElementById('deceasedName').value = state.fullName || '';
  renderForm();
  renderOrder();
  renderChecklist();
}

load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
